openapi: 3.1.0
info:
  title: dsh-pet HTTP API
  version: 0.3.7
  summary: DSHペットプラグインのホストHTTP API
  description:
    'ホストはDSHの`webServer`に`/dsh-pet-7340`を登録し、ブラウザー・Electron・設定画面が同じ`handlePetRoute`を利用します。この仕様は他のプラグインやスクリプト向けの公開契約です。


    ポートは`ctx.webServer.port`で、`dsh web`の標準値は3080です。7340はパス名でありポートではありません。127.0.0.1のみで待ち受け、認証はありません。公開ネットワークへ転送しないでください。デスクトップは`dsh-pet-bridge://`とメインプロセスのパイプで同じハンドラーに接続します。


    ```bash

    BASE=http://127.0.0.1:3080/dsh-pet-7340

    curl -s $BASE/state

    curl -s -X POST "$BASE/whisper?pet=main"

    curl -s $BASE/state # pets.main.say.data.textを参照

    ```


    データの取得先は`GET /state`です。公開状態Sの各リーフは`{ counter, data }`を持ちます。操作APIは原則として結果をSへ書き、`{ ok }`を返します。操作後はすぐに`/state`を取得できます。一部の操作は受付IDや補正後の座標も返します。`counter`は`Date.now()`を基に同一ミリ秒でも加算し、再起動後も逆行しない厳密な単調増加値です。利用側は前回の値と比較して変更されたリーフだけを処理してください。毎秒のポーリング、または`since`と`timeout`によるロングポーリングを利用できます。'
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: リポジトリと利用手順
  url: https://github.com/PC2005-cloud/dsh-pet
servers:
  - url: http://127.0.0.1:{port}
    description: ローカルのDSH Webサービス。`{port}`は`ctx.webServer.port`（標準3080）。固定のルート接頭辞`/dsh-pet-7340`にある7340はポート番号ではありません。
    variables:
      port:
        default: "3080"
        description: DSH Webサービスが実際に待ち受けるポート
tags:
  - name: State
    description: 統一状態の取得。メモリーのみを読む副作用のないデータ取得先。
  - name: Action
    description: ホストの動作を実行してStateへ書き込む操作API。原則として`{ ok }`を返します。
  - name: Config
    description: 設定の取得・保存・保存先情報
  - name: Assets
    description: フォント、通知アイコン、会話画像、動画素材
paths:
  /dsh-pet-7340/state:
    get:
      tags:
        - State
      operationId: getState
      summary: 統一状態Sを取得
      description:
        "ホストの公開状態を返します。トップレベルは`counter`・`sections`・`pets`です。全体共有の`sections`には`balance`・`workStatus`・`notify`・`config`、ペットごとの`pets[id]`には`say`・`anim`・`position`・`throw`・`lock`があります。各リーフは`{
        counter, data }`です。


        ペットへ初めて書き込むと5リーフを同時に作り、未書き込みのリーフは`{ counter: 0, data: null }`になります。何も書いていないペットのエントリーはありません。`data: null`は無視してください。


        `position`と`throw`はホストから描画側への指令で、現在位置を返す状態ではありません。描画側は指令を実行し、同じリーフへ書き戻しません。`lock`は占有状態で、描画側はランダム動作・自動イベントを止め、`expiresAt`に従って自力で解除します。


        `say`は`{ text, image?, duration?, anim? }`または`{ clear: true }`です。`duration`は標準10000ms、0で非表示。`anim`は標準trueで`events.whisper`を再生します。ひとりごと・会話はこれらを省略し、既定値を使用します。


        `sections.config`は設定変更の通知だけを保持し、`data`は常に`{}`です。現在は`POST /pet-display`だけが更新し、利用側はcounterが変われば`GET /config`を再取得します。`PUT
        /config`と`POST /config`は結果を呼び出し元へ返すため、このリーフを更新しません。手動のファイル編集は監視せず、再読み込みが必要です。


        トップレベルの`counter`は最後の書き込み番号で、初期値は0です。各counterは書き込み時だけ変わります。HTTPエラーや接続失敗と、変化のない状態を区別してください。`cache-control:
        no-cache, no-store`を返し、外部照会やモデル生成は一切行いません。


        ペットIDは`pets[].id`です。ドットを含められるため、`pets[id]`などの参照を`.`で分割しないでください。ID一覧は`GET /config`から取得します。


        ロングポーリングでは`since=<前回のトップレベルcounter>&timeout=<ms>`を必ず組で指定します。異なるバージョンなら即時応答し、同じなら変更またはタイムアウトまで待機します。引数なしでは直ちに全状態を返します。最初は引数なしで取得し、以後は受信するたびにcounterを更新して次の要求を送ってください。"
      parameters:
        - name: since
          in: query
          required: false
          description: 前回のSのバージョン（レスポンスのトップレベル`counter`）。現在と異なれば即時応答し、同じなら待機。0も有効です。`timeout`との組指定が必須で、片方だけなら400。
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 1755000000007
        - name: timeout
          in: query
          required: false
          description: 待機上限ms。0〜10000の非負整数で、0は即時応答。`since`との組指定が必須。
          schema:
            type: integer
            minimum: 0
            maximum: 10000
          example: 1000
      responses:
        "200":
          description: 現在の状態。ロングポーリングでは変更またはタイムアウト後の状態。
          headers:
            cache-control:
              description: 常に`no-cache, no-store`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollState"
        "400":
          description: '`since`・`timeout`の不正（片方のみ、非整数、負数、上限超過）。理由を含む`{ error: "..." }`を返します。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /dsh-pet-7340/balance:
    post:
      tags:
        - Action
      operationId: refreshBalance
      summary: 残高を即時更新
      description:
        "現在の会話のプロバイダー（`ctx.agentDefaultModel.currentSelection()`）へ残高を照会し、`sections.balance`に書き込みます。残高そのものは返しません。未対応・認証情報不足・取得失敗も`{
        ok: false, reason, message }`として状態へ書きます。この場合も更新操作は完了したのでAPIは`ok: true`を返します。実際の利用可否は`sections.balance.data.ok`で判定してください。手動更新には`manual:
        true`を付け、利用不可の理由を必ず表示します。定期更新はホストが`eventsRefreshSec.balance`（標準1800秒）で行います。"
      responses:
        "200":
          description: 更新操作が完了。残高を取得できたことを意味しません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/whisper:
    post:
      tags:
        - Action
      operationId: whisper
      summary: 指定ペットのひとりごとを即時生成
      description: 所属エントリーの`whisperPrompt`を使って生成し、`pets.<id>.say`へ書き込みます。本文は返さず`/state`から取得します。`whisperEnabled`は自動生成だけを制御し、このAPIは制限しません。失敗時はSを変更せず、ホストに警告を記録して`generate-error`を返します。画像が有効でプールが空でなければ1枚をランダムに添付します。`whisperModel`が優先され、空なら現在の会話のモデルを使います。指定モデルで失敗した場合は現在のモデルで1回再試行します。
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: "原則HTTP 200で、失敗は`ok: false`。`provider-missing`はモデルなし（単独モードでは常にこれ）、`generate-error`は生成・IO失敗（message付き）、`unknown-pet`は生成までの間に対象が削除された場合です。mainへ勝手に変更したり、削除済みペットの状態を書いたりしません。"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/broadcast:
    post:
      tags:
        - Action
      operationId: broadcast
      summary: 外部のテキストを吹き出しへ表示
      description:
        "生成は行わず、呼び出し元のテキストを`pets.<id>.say`へ書きます。ブラウザー・デスクトップは次回の状態取得で表示します。本文は`/state`で取得してください。


        `text`は必須でtrim後に空なら`bad-request`です。長さや頻度の制限、切り詰め、暗黙の破棄・待ち行列はありません。`pet`は実在するIDが必須です。画像は所属エントリーで有効な`image`名、またはhttp/httpsの完全な`url`のどちらか一方を任意指定します。池外・実体のない名前は`unknown-image`、両方指定は`bad-request`です。


        `duration`は標準10000ms、0で表示しない指定です。非負の有限数が必要で上限はありません。0を指定しても既存の吹き出しは閉じません。閉じるには`/bubble/clear`を使います。`anim`は厳密なfalseだけが連動を無効にし、文字列のfalseなどは有効扱いです。無効時は動画プールを参照しないため`events.whisper`がなくても表示できます。


        `duration`と`anim`は独立しています。`anim: false, duration: 3000`で3秒だけ表示、`anim: true, duration: 0`で動画だけ再生します。状態には既定値補完済みの値を書き込みます。失敗はHTTP
        200の`ok: false`で表します。"
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  description: 表示する本文。trim後に空ではいけません。長さ制限はありません。
                image:
                  type: string
                  description: 任意の画像名。拡張子・パスを除く`memes`のキーで、対象エントリーのプールと素材ディレクトリに実在する必要があります。なければ`unknown-image`。`url`との同時指定は`bad-request`。
                  example: 可爱
                url:
                  type: string
                  format: uri
                  description: 任意の外部画像の完全URL。http/httpsのみ許可し、プールは照会しません。`image`と排他的です。画像はimg要素で表示します。動画はfetchを使うため、別オリジンの動画には配信側のCORS許可が必要です。同じDSHポートのURLなら同一オリジンです。
                  example: https://cdn.example.com/notice.png
                duration:
                  type: number
                  minimum: 0
                  default: 10000
                  description: 吹き出しの表示時間ms。標準10000、0で非表示。非負の有限数が必要で上限なし。不正なら`bad-request`。
                  example: 3000
                anim:
                  type: boolean
                  default: true
                  description: "`events.whisper`を1回再生するか。標準true。厳密なfalseだけが無効で、文字列のfalseは有効扱いです。"
                  example: false
            examples:
              textOnly:
                summary: 1文表示（標準10秒・動画連動）
                value:
                  text: ご主人、水分補給の時間です
              withMeme:
                summary: 内蔵の会話画像を添付
                value:
                  text: 確認できました。すべて正常です
                  image: 厉害了我的鲸
              withUrl:
                summary: 自分で配信する画像をURLで添付
                value:
                  text: 確認できました。すべて正常です
                  url: https://cdn.example.com/notice.png
              noAnimShort:
                summary: 動画なしで3秒間の吹き出し
                value:
                  text: 水分補給の時間です
                  duration: 3000
                  anim: false
      responses:
        "200":
          description: "原則200（405/400を除く）。失敗は`ok: false`で、理由は`bad-request`、`pet-required`、`unknown-pet`、`unknown-image`、`generate-error`。"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: '不正なJSON本文。`{ "error": "invalid JSON body" }`。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/bubble/clear:
    post:
      tags:
        - Action
      operationId: clearBubble
      summary: 現在の発話の吹き出しを閉じる
      description: "`pets.<id>.say`へ`{ clear: true }`を書き、次回の状態取得で発話の吹き出しを閉じます。空文字列は無効扱いなので清去指令の代わりになりません。残高・作業状態の吹き出し、動画・位置・投擲は変更しません。現在吹き出しがなくても成功する冪等操作です。占有中は正しい`?lock=`が必要で、占有がなければ通過します。リクエスト本文はありません。確認は`/state`を参照してください。"
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
      responses:
        "200":
          description: 原則200（405を除く）。失敗理由は`pet-required`、`unknown-pet`、`generate-error`。吹き出しがないことは失敗ではありません。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/anim:
    post:
      tags:
        - Action
      operationId: playAnimation
      summary: 指定した動画を再生
      description:
        "`name`または`url`を厳密に一方だけ指定します。`name`は所属エントリーの動画プールの名前で、右クリックメニューと同じ動作（文字入りの反転補正、移動動画の実移動など）になります。`url`はhttp/httpsの完全な外部URLで、プールを照会せず1回再生し、通常の動画チェーンへ戻ります。URLには分類・移動・反転補正のメニュー属性がありません。


        対象petは必須です。プール外の名前は`unknown-animation`、不正な指定は`bad-request`です。素材自体がない場合は描画側で読み込みに失敗します。


        `facing`は任意で、leftは素材そのまま、rightは鏡像です。省略時は現在の向きを維持し、状態にもフィールドを書きません。明示値は文字分類のnoMirror補正より優先し、次の方向転換または明示指定まで維持します。URL再生にも適用されます。


        動画はfetchとblobで読み、外部配信側にAccess-Control-Allow-Originが必要です。ホストはプロキシしません。同じDSHのポートなら同一オリジンです。


        `GET /config`の各エントリーのpetsから対象IDを見つけ、そのエントリーのidle・turn・drag・clicks・moves.actions・categories・eventsの和集合を使ってください。pet
        packは独自の素材ディレクトリを使い、mainの素材へフォールバックしません。


        結果は受付を示し、完了を保証しません。`playbackId`で実際の状態を取得できます。同じ動画の再要求もcounterを更新しますが、描画側の前回の切り替え準備中に重なると重複防止で再生されないことがあります。"
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`name`と`url`を一方だけ指定。両方または両方なしは`bad-request`。"
              properties:
                name:
                  type: string
                  description: 対象ペットの7種類のプールの和集合に含まれる動画ID。プール外は`unknown-animation`。`url`と排他的です。
                  example: 东张西望
                url:
                  type: string
                  format: uri
                  description: 外部動画の完全URL。http/httpsのみ。プールを参照せず1回再生し、メニューの移動・反転補正は適用しません。別オリジンでは配信側のCORS許可が必要です。`name`と排他的です。
                  example: https://cdn.example.com/sidebar.webm
                facing:
                  type: string
                  enum:
                    - left
                    - right
                  description: 任意の向き。leftは元の素材、rightは鏡像。省略時は現在の向きを維持。不正値は`bad-request`。明示値は文字入り動画の反転補正より優先されます。
                  example: right
            examples:
              turn:
                summary: プール内の方向転換を再生
                value:
                  name: 东张西望
              facing:
                summary: 向きを明示（右向き・鏡像）
                value:
                  name: 东张西望
                  facing: right
              move:
                summary: 移動動画を再生（メニューと同じ実移動）
                value:
                  name: 螃蟹走路
              byUrl:
                summary: 自分で配信する動画をURLで再生
                value:
                  url: https://cdn.example.com/sidebar.webm
      responses:
        "200":
          description: 原則200（405/400を除く）。失敗理由は`bad-request`、`pet-required`、`unknown-pet`、`unknown-animation`、`generate-error`。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required:
                          - playbackId
                        properties:
                          playbackId:
                            type: string
                            description: "今回の再生受付ID。`ok: true`は受付だけを表し、完了は`GET /playback/{id}`で確認します。"
                            example: pb-mfh2k1-1
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: '不正なJSON本文。`{ "error": "invalid JSON body" }`。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/position:
    post:
      tags:
        - Action
      operationId: setPetPosition
      summary: 指定位置へペットを移動
      description:
        "`pets.<id>.position`へ移動指令を書きます。座標はペットの中心を表す0〜1の正規化座標です。ブラウザーはビューポート、デスクトップは全画面の作業領域の外接矩形を基準にします。同じ値でも両者の位置は異なります。


        範囲外は0〜1へ補正し、画面間の空白に入る場合は最寄りの到達可能な画面へ寄せます。レスポンスのx/yはホストが補正した値です。体が半分はみ出す指定も許可し、手動ドラッグの体の縁による制限は適用しません。


        動画は変更しませんが、歩行中なら歩行を中断します。クリック・ドラッグ中は描画側が指令を破棄する場合があります。この場合も受付済みなのでokはtrueで、実行されたことは保証しません。破棄は状態へ通知されません。


        modeは必須です。instantは即時、springは過減衰ばねで十分近く低速になるまで追従、lineはdurationミリ秒でピクセル空間を直線補間します。durationはlineだけで必須の非負有限数で、0は即時。上限はなく、他のmodeでは指定しても無視します。"
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - x
                - y
                - mode
              properties:
                x:
                  type: number
                  description: 中心の横方向の正規化座標。0〜1、範囲外や画面間の空白は補正します。
                  example: 0.5
                y:
                  type: number
                  description: 中心の縦方向の正規化座標。0〜1、範囲外や画面間の空白は補正します。
                  example: 0.35
                mode:
                  type: string
                  enum:
                    - instant
                    - spring
                    - line
                  description: 必須の移動モード。3種類以外や省略は`bad-request`。
                  example: line
                duration:
                  type: number
                  description: lineモードで必須の所要時間ms。非負有限数、上限なし、0は即時。他のモードでは無視。不正値は`bad-request`。
                  example: 1200
              examples:
                instant:
                  summary: 左下へ即時移動
                  value:
                    x: 0.05
                    y: 0.9
                    mode: instant
                spring:
                  summary: 画面中央の少し上へばねで滑らかに移動
                  value:
                    x: 0.5
                    y: 0.35
                    mode: spring
                line:
                  summary: 画面中央の少し上へ1.2秒の直線移動
                  value:
                    x: 0.5
                    y: 0.35
                    mode: line
                    duration: 1200
      responses:
        "200":
          description: "原則200（405/400を除く）。失敗は`ok: false`。成功時はホスト補正後のx/yも返します。"
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required:
                          - x
                          - y
                        properties:
                          x:
                            type: number
                            description: 補正後の横座標
                          y:
                            type: number
                            description: 補正後の縦座標
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: '不正なJSON本文。`{ "error": "invalid JSON body" }`。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/throw:
    post:
      tags:
        - Action
      operationId: throwPet
      summary: 初速度を与えてペットを投げる
      description:
        "`pets.<id>.throw`へ指令を書き、現在位置から投げます。つかむ操作は不要です。重力・反発・摩擦・複数画面の境界・着地変形・任意のペット衝突は手動投擲と共通です。


        angleは度数で0が右、90が上、-90が下。反時計回りが正で、任意の実数を指定できます。powerは正の倍率で、制限前速度はpower×1200px/s、実速度は3600×(1−exp(−v/3600))です。power=1で約1021、3で約2276px/s、極限は3600です。小さいpowerでも投げ、手動の「静かに置く」500px/sしきい値は適用しません。ユーザーがクリック・ドラッグ中は無視する場合がありますが、受付はok:trueです。"
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
        - $ref: "#/components/parameters/LockQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - angle
                - power
              properties:
                angle:
                  type: number
                  description: 方向の度数。0は右、90は上、-90は下。反時計回りが正、正規化不要の実数。
                  example: 45
                power:
                  type: number
                  exclusiveMinimum: 0
                  description: 正の力の倍率。1は速度制限前の1200px/sで、実際の初速は約1021px/s。
                  example: 1
              examples:
                upRight:
                  summary: 通常の強さで右上へ投げる
                  value:
                    angle: 45
                    power: 1
                hardLeft:
                  summary: 強く左上へ投げる
                  value:
                    angle: 135
                    power: 3
      responses:
        "200":
          description: 原則200（405/400を除く）。失敗理由は`bad-request`、`pet-required`、`unknown-pet`、`generate-error`。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: '不正なJSON本文。`{ "error": "invalid JSON body" }`。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/lock:
    post:
      tags:
        - Action
      operationId: acquireLock
      summary: 占有ロックの取得・延長
      description:
        "連携動作の前にロックを取得すると、対象を独占できます。`/anim`・`/broadcast`・`/position`・`/throw`・`/bubble/clear`には`?lock=<lockId>`が必要になり、自動のランダム動作・移動・ひとりごと・残高・作業状態は停止します。


        取得時に進行中の再生は`cancelled`かつ`reason: frozen`となり、解放しても続きは再開しません。先にロックを取得してから再生してください。延長は再凍結しません。


        第三者間は先着順で、占有済みなら`locked`とexpiresAtを返します。ユーザーのクリック・ドラッグ・非表示・終了は優先され、描画側がforce解放を報告します。


        lockIdなし＋空きは新規取得、lockIdなし＋占有中はlocked、一致するlockIdは同じIDを延長、不一致ならlock-lost/unknown、失効したIDは記録されたcauseでlock-lostです。古いIDでロックを復活させません。延長はハートビート兼失効確認で、専用の確認APIはありません。


        ロックはメモリー上だけで、TTLは標準2分・上限30分、アンロードや再起動で失効します。期限は遅延判定し、描画側もexpiresAtから解除します。占有がない場合、5つの操作APIはlock引数を無視して通常通り動作します。"
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lockId:
                  type: string
                  description: 指定すると現在のロックを延長し、省略すると新規取得します。
                  example: lk-mfh2k1-1
                ttl:
                  type: number
                  default: 120000
                  minimum: 1000
                  maximum: 1800000
                  description: 占有時間ms。標準120000、範囲1000〜1800000。延長時の省略は前回のTTLを引き継ぎます。範囲外・非有限数は補正せず`bad-request`。
                  example: 120000
            examples:
              acquire:
                summary: ロック取得（標準2分）
                value: {}
              renew:
                summary: 同じロックを2分延長
                value:
                  lockId: lk-mfh2k1-1
      responses:
        "200":
          description: 原則200（405/400を除く）。失敗理由は`bad-request`、`pet-required`、`unknown-pet`、`locked`（expiresAt付き）、`lock-lost`（cause付き）。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/OkResponse"
                      - type: object
                        required:
                          - lockId
                          - petId
                          - expiresAt
                        properties:
                          lockId:
                            type: string
                            description: 占有ID。以後の操作へ`?lock=`で渡します。
                            example: lk-mfh2k1-1
                          petId:
                            type: string
                            description: 占有対象のペットID
                            example: main
                          expiresAt:
                            type: integer
                            format: int64
                            description: 有効期限（エポックms）
                            example: 1755000030000
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: '不正なJSON本文。`{ "error": "invalid JSON body" }`。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/lock/release:
    post:
      tags:
        - Action
      operationId: releaseLock
      summary: 占有を解放（所有者の終了・ユーザーの操作）
      description: 占有を解放し、自動処理とランダム動作を再開します。lockIdかforce:trueの厳密に一方を指定します。所有者のlockId解放はcause:released、描画側がユーザー操作を報告するforce解放はcause:preemptedです。外部プラグインはforceを使いません。ロックがなければ成功する冪等操作ですが、存在するロックに別のIDを指定するとlock-lostです。動画・吹き出し・位置そのものは変更せず、制御権だけを解放します。
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: lockIdかforceを一方だけ指定。両方または両方なしは`bad-request`。
              properties:
                lockId:
                  type: string
                  description: 所有者が解放する現在の占有ID
                  example: lk-mfh2k1-1
                force:
                  type: boolean
                  description: 厳密なtrueのみ有効。描画側がユーザーのクリック・ドラッグ・非表示・終了を報告して強制解放します。
                  example: true
            examples:
              byHolder:
                summary: 所有者が解放
                value:
                  lockId: lk-mfh2k1-1
              byUser:
                summary: 描画側がユーザーによる操作を報告
                value:
                  force: true
      responses:
        "200":
          description: 原則200（405/400を除く）。失敗理由は`bad-request`、`pet-required`、`unknown-pet`、`lock-lost`（cause付き）。ロックなしは成功。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: '不正なJSON本文。`{ "error": "invalid JSON body" }`。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/playback/{id}:
    get:
      tags:
        - Action
      operationId: getPlayback
      summary: 指定した再生の実際の状態を取得
      description:
        "POST /animのok:trueは受付だけです。このAPIは実際に再生するブラウザーまたはデスクトップからの報告を返し、動画時間による推測はしません。


        状態はaccepted→playing→ended/failed/cancelled。終端状態は変更せず、重複報告は冪等です。waitとtimeoutを組で指定すると対象状態またはタイムアウトまで待ちます。到達した場合matched:true、時間切れはfalseです。失敗時にもすぐ戻るよう`wait=ended,failed,cancelled`を推奨します。両方省略なら即時応答です。


        終端記録は約60秒後に削除され、以後404になります。IDはホストの1回の実行内でのみ一意で、再起動で失効します。個々の呼び出しに属する有限寿命のリソースであり、/stateの全体配信には含めません。"
      parameters:
        - name: id
          in: path
          required: true
          description: POST /animのレスポンスにあるplaybackId
          schema:
            type: string
          example: pb-mfh2k1-1
        - name: wait
          in: query
          required: false
          description: 待つ状態のカンマ区切りリスト。accepted/playing/ended/failed/cancelledが有効。既に一致していれば即時応答。timeoutとの組指定が必須。
          schema:
            type: string
          example: ended,failed,cancelled
        - name: timeout
          in: query
          required: false
          description: 待機上限ms。0〜10000の整数。0は即時。waitと組で必須、不正なら400。
          schema:
            type: integer
            minimum: 0
            maximum: 10000
          example: 10000
      responses:
        "200":
          description: 再生記録。matchedはwaitの状態への到達を表し、waitなしでは常にfalse。
          content:
            application/json:
              schema:
                type: object
                required:
                  - playbackId
                  - petId
                  - name
                  - status
                  - createdAt
                  - updatedAt
                  - matched
                properties:
                  playbackId:
                    type: string
                  petId:
                    type: string
                    description: 対象ペットID
                  name:
                    type: string
                    description: 動画ID（素材ファイル名）
                  status:
                    type: string
                    enum:
                      - accepted
                      - playing
                      - ended
                      - failed
                      - cancelled
                  createdAt:
                    type: integer
                    description: 受付日時（エポックms）
                  updatedAt:
                    type: integer
                    description: 最後の状態変更日時（エポックms）
                  endedAt:
                    type: integer
                    description: endedのときだけ存在する完了日時
                  reason:
                    type: string
                    description: failed/cancelled時の理由。asset-loadは素材取得失敗、decode-errorは復号失敗、play-rejectedは自動再生拒否、busyは移動系による占有、supersededは割り込み、frozenは占有ロックによる中断です。frozenは解除後も続きから再開しません。
                  matched:
                    type: boolean
                    description: trueならwait対象の状態へ到達、falseなら時間切れ
        "400":
          description: wait/timeoutの組指定違反、不正な状態名、0〜10000の整数でないtimeout。理由付きのerrorを返します。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '存在しない・期限切れのID。`{ "error": "unknown playback" }`。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/playback/{id}/report:
    post:
      tags:
        - Action
      operationId: reportPlayback
      summary: 描画側からホストへ再生状態を報告する内部API
      description: プラグインの描画側だけが呼びます。playingはplay()が成功して実際に再生を開始、endedは終了、failedは素材・復号・自動再生・移動占有の失敗、cancelledはクリック・ドラッグ・ひとりごと・残高・作業状態などによる割り込みです。acceptedはホストが書くため報告すると400です。終端後の報告は無視して200を返します。新しい再生要求による割り込みはホストが記録するため描画側の報告は不要です。
      parameters:
        - name: id
          in: path
          required: true
          description: playbackId
          schema:
            type: string
          example: pb-mfh2k1-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - playing
                    - ended
                    - failed
                    - cancelled
                  description: 4状態のみを受け付けます。acceptedの報告は400。
                reason:
                  type: string
                  description: 任意の理由文字列。描画側ではasset-load/decode-error/play-rejected/busy/superseded/frozenを使用します。
              examples:
                playing:
                  summary: 再生が実際に開始
                  value:
                    status: playing
                ended:
                  summary: 最後まで再生
                  value:
                    status: ended
                failed:
                  summary: 素材を取得できない
                  value:
                    status: failed
                    reason: asset-load
      responses:
        "200":
          description: "常に200の`{ ok: true }`。更新または冪等な無視（重複・終端後の報告）を成功とします。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: 不正な状態名（acceptedを含む）または不正なJSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '存在しない・期限切れのID。`{ "error": "unknown playback" }`。'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/chat:
    get:
      tags:
        - Action
      operationId: getChatMemory
      summary: 直近の会話履歴を取得
      description: 会話画面を開く際に1回取得する履歴です。ホストだけがmemory.jsonを読み書きし、両画面で共有します。全履歴は保持し、応答ではchatMemoryRounds（標準5往復、1往復は質問と回答）だけを末尾から返します。
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: 失敗も200でok:false。理由はpet-required、unknown-pet、generate-error（履歴・設定の読み込み失敗）。
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - ok
                      - messages
                      - rounds
                    properties:
                      ok:
                        type: boolean
                        const: true
                      messages:
                        type: array
                        description: 時系列順のメッセージ。最大rounds×2件。
                        items:
                          $ref: "#/components/schemas/ChatMemoryMessage"
                      rounds:
                        type: integer
                        description: 対象に有効なchatMemoryRounds
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Action
      operationId: sendChat
      summary: 指定ペットへ話しかけて返答を生成
      description: 履歴を付けて生成し、質問と返答を保存してpets.<id>.sayへ書きます。okを受け取ったら/stateから本文を取得してください。trim後に空または2000文字超ならbad-requestです。chatModelを優先し、空なら現在のモデル、指定モデルで失敗したら現在のモデルで1回再試行します。履歴には本文だけを保存し、画像の表示用マーカーは含めません。
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 2000
                  description: ユーザーメッセージの本文
            examples:
              hello:
                summary: あいさつする
                value:
                  text: 今日はどうだった？
      responses:
        "200":
          description: 原則200（405を除く）。失敗理由はpet-required、unknown-pet、bad-request、provider-missing、generate-error。履歴ロック待機中に対象が削除された場合もunknown-petとし、履歴・吹き出しを書きません。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/FailureResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/config:
    get:
      tags:
        - Config
      operationId: getConfig
      summary: 結合済みの設定を取得
      description: 内蔵assets/config.jsoncとユーザーのmain-config.jsoncを統合し、利用側がそのまま使える設定を返します。トップレベルは配列ではなくエントリー名から設定への対応です。1エントリーは1種族で、動画プール・重み・人格・画像・モデルを共有するpetsインスタンスを持ちます。mainは標準＋ユーザー設定、追加種族はpet/<名>-config.jsonに基づきます。対象の動画や画像はまずIDから所属エントリーを特定して参照します。全ペット共通の動画プールはありません。
      responses:
        "200":
          description: エントリー名から設定オブジェクトへの対応
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/PetConfigEntry"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: 設定ファイルの破損・読み込み失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Config
      operationId: saveConfig
      summary: ユーザー設定を保存
      description:
        "許可項目を検証してユーザー設定を再構成し、保存後の統合設定を返します。対象はpetsのid/name/size/balanceEnabled/whisperEnabled/workStatusEnabled/fixedEnabled/display/position、トップレベルのnotificationsEnabled/whisperImageEnabled/chatImageEnabled/confineToScreen/physics/whisperModel/chatModel/chatMemoryRounds/chatImageLimitです。本文で省略した項目や、whisperPrompt/memes/eventsRefreshSecなどの高度な項目は既存ファイルから保持します。


        既存ファイルがJSONCとして解析できない場合は書かずに409を返します。利用者が再構成を選んだ場合だけforce=1で再試行してください。保存後は非同期にデスクトップHelperを再起動し、応答をブロックしません。"
      parameters:
        - name: force
          in: query
          required: false
          description: 1で破損設定の事前検査を省略し、強制再構成して保存
          schema:
            type: string
            enum:
              - "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveConfigRequest"
            examples:
              singlePet:
                summary: ペット1体の設定を保存
                value:
                  pets:
                    - id: main
                      name: 青髪のメイド
                      size: 462
                      balanceEnabled: true
                      whisperEnabled: true
                      workStatusEnabled: true
                      fixedEnabled: false
                      display: both
                      position:
                        corner: bottom-right
                        marginX: 24
                        marginY: 24
                  notificationsEnabled: true
                  whisperImageEnabled: true
                  chatImageEnabled: true
      responses:
        "200":
          description: 保存成功。保存後の統合設定を返します。
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/PetConfigEntry"
        "400":
          description: 不正なJSONまたは設定。例：空・64文字超・ファイル名に使えない文字を含むid、正でないsize、非booleanのbalanceEnabled、不正なdisplay/corner、数値でない余白など。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: ユーザー設定が破損しforce=1なし。利用者に確認し、キャンセルなら変更せず、再構成が選ばれた場合だけforce=1で再試行します。
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - needConfirm
                  - userFile
                properties:
                  error:
                    type: string
                    const: user config is unparsable
                  needConfirm:
                    type: boolean
                    const: true
                  userFile:
                    type: string
                    description: 破損したユーザー設定の絶対パス
    post:
      tags:
        - Config
      operationId: syncConfigFromDefault
      summary: 標準設定でユーザー設定を置き換える
      description: 内蔵assets/config.jsoncのコメントを含む原文を丸ごとユーザー設定へコピーします。初期設定の復元と編集用の完全な設定ファイルの生成を兼ねます。保存後にデスクトップHelperを非同期再起動し、新しい統合設定を返します。
      responses:
        "200":
          description: 同期成功。新しい統合設定を返します。
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/PetConfigEntry"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: 内蔵の標準ファイルがない、またはユーザーディレクトリへ書き込めない。部分的な設定を残して成功扱いにはしません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dsh-pet-7340/pet-display:
    post:
      tags:
        - Config
      operationId: setPetDisplay
      summary: ペット1体の表示先を変更
      description:
        IDから所属エントリーを逆引きし、displayだけを更新して統合設定を返します。mainはmain-config.jsonc、追加種族はpet/<接頭辞>-config.json（jsoncも対応）へ保存します。全pets配列や保存先の指定は不要です。PUT
        /configと同じ再構成・高度な既存項目の保持を行います。保存後はHelperを非同期再起動するため、呼び出したウィンドウが終了してレスポンスを受け取れない場合があります。sections.configのcounterも更新して他の画面に再取得を通知します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - display
              properties:
                id:
                  type: string
                  description: 統合後に全体で一意となるペットのインスタンスID
                display:
                  type: string
                  enum:
                    - web
                    - desktop
                    - both
                    - none
                  description: 表示先。webはブラウザー、desktopはデスクトップ、bothは両方、noneは非表示。noneからの復帰は設定画面で行います。
            examples:
              toWeb:
                summary: デスクトップから外し、ブラウザーに残す
                value:
                  id: main
                  display: web
      responses:
        "200":
          description: "成功時は統合設定、業務上の失敗は`{ ok: false, reason, message }`で、いずれも200です。成功体にokはありません。失敗理由はpet-required（idなし・空白）、bad-request（displayや所属設定が不正）、unknown-pet（重複IDで除外された対象も含む）、generate-error（設定の読み書き失敗・ファイルなし）。"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PetConfigEntry"
                  - $ref: "#/components/schemas/FailureResponse"
        "400":
          description: 不正なJSON本文。プロトコルエラーとして400を返します。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/config/meta:
    get:
      tags:
        - Config
      operationId: getConfigMeta
      summary: 設定とデータの保存先を取得
      description: 設定画面の高度な設定・アンインストールと保存先の表示用データです。設定・各データの保存先と、アンインストールに使うprofileを返します。
      responses:
        "200":
          description: 保存先一覧
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - default
                  - animations
                  - storage
                  - profile
                properties:
                  user:
                    type: string
                    description: ユーザー設定ファイルの絶対パス
                  default:
                    type: string
                    description: パッケージ内の標準設定の絶対パス
                  animations:
                    type: string
                    description: ユーザー動画素材のルートの絶対パス
                  storage:
                    type: array
                    description: ユーザーデータ、Electron、デスクトップキャッシュ、ダウンロードキャッシュ、プラグイン本体の保存先
                    items:
                      $ref: "#/components/schemas/StorageEntry"
                  profile:
                    type: string
                    description: アンインストール用のDSH profile名。`dsh plugin --profile <名> remove dsh-pet`で使用。特定できない場合は空文字列。
  /dsh-pet-7340/models:
    get:
      tags:
        - Config
      operationId: listModels
      summary: 選択可能なプロバイダーとモデルを取得
      description: DSHのモデル選択と同じllmサービスを参照します。listProviders()で登録済みルート、listModels(provider)でモデルを取得する読み取り専用APIです。1プロバイダーのモデル取得が失敗しても、そのmodelsを空にして他は返します。登録ルートがなければlistConfigurableProviders()を使用します。nameがなければidで表示します。
      responses:
        "200":
          description: プロバイダーとモデルの一覧
          content:
            application/json:
              schema:
                type: object
                required:
                  - providers
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          description: プロバイダー一覧の読み込み失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dsh-pet-7340/reload:
    post:
      tags:
        - Action
      operationId: reload
      summary: Helperを再起動してデスクトップを再読み込み
      description: 保存時と同じ直列キューで旧Helperの終了を待ってから新しいプロセスを起動し、全ウィンドウを最新の設定で再作成します。再起動の完了を待たず200を返します。呼び出したHelperが終了するため応答の到達は保証しません。
      responses:
        "200":
          description: 再起動キューへ追加済み
          content:
            application/json:
              schema:
                type: object
                required:
                  - reloading
                properties:
                  reloading:
                    type: boolean
                    const: true
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /dsh-pet-7340/thumb/{petId}/{file}:
    get:
      tags:
        - Assets
      operationId: getAnimation
      summary: ペットの動画素材を取得
      description: pet/<petId>-animation/がある場合はその種族の素材だけを検索し、なければ404です。それ以外はmain-animation/<webmまたはmov>を優先し、パッケージのassets/<拡張子>へフォールバックします。主設定の全インスタンスで共有します。petIdはパスではなく素材ルートの識別子で、区切りや予約文字はパス結合前に400とします。中国語名などの有効な識別子も使用できます。
      parameters:
        - name: petId
          in: path
          required: true
          description: 素材ルートID。追加種族はファイル名の接頭辞、主ペットはmain。
          schema:
            type: string
        - name: file
          in: path
          required: true
          description: 動画ファイル名。サブパス可、拡張子は.webmまたは.movが必須。
          schema:
            type: string
      responses:
        "200":
          description: 動画ファイル
          content:
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "400":
          description: petIdの不正文字、未対応拡張子、または不正なパス構造
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "素材なし（dsh-pet: asset not found）"
          content:
            text/plain:
              schema:
                type: string
  /dsh-pet-7340/font/{file}:
    get:
      tags:
        - Assets
      operationId: getFont
      summary: フォントを取得
      description: パッケージのassets/fonts/から取得します。petIdの階層はありません。
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: フォントファイル
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "フォントなし（dsh-pet: font not found）"
          content:
            text/plain:
              schema:
                type: string
  /dsh-pet-7340/pic/{file}:
    get:
      tags:
        - Assets
      operationId: getPic
      summary: 通知アイコンまたは会話画像を取得
      description: "`/pic/<名>.png`は内蔵assets/pic/の通知アイコンです。`/pic/memes/<素材ルート>/<名>.png`は会話画像です。種族のpet/<素材ルート>-memes/があればそこだけを検索し、なければ404。種族専用ディレクトリがなければユーザーのmemes/を優先して内蔵assets/memes/を検索します。素材ルートは所属エントリーのassetRootで、主ペットはmain、追加種族は設定ファイルの接頭辞です。旧形式のmemes/<名>.pngも対応します。"
      parameters:
        - $ref: "#/components/parameters/AssetFile"
      responses:
        "200":
          description: 画像ファイル
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "400":
          description: "素材ルートの不正文字（dsh-pet: invalid asset root）"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: "画像なし（dsh-pet: pic not found）"
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    PetIdQuery:
      name: pet
      in: query
      required: true
      description: 必須の対象ペットID（pets[].id）。省略・空・空白のみはpet-required、存在しないIDはunknown-petです。現在選択中のペットや先頭への既定値はなく、/petの選択には依存しません。ドットや中国語も使用できるため、状態のパスをドットで分割しないでください。
      schema:
        type: string
      example: main
    LockQuery:
      name: lock
      in: query
      required: false
      description: POST /lockで取得した占有ID。占有がなければ無視します。占有中は必須で、省略はlock-required、不一致はlock-lost（cause付き）。所有者だけが操作できますが、ユーザーのクリック・ドラッグなどは優先され、描画側がforce解放を報告します。
      schema:
        type: string
      example: lk-mfh2k1-1
    AssetFile:
      name: file
      in: path
      required: true
      description: ファイル名。サブディレクトリ可。会話画像はmemes/<素材ルート>/<名>.png（旧形式memes/<名>.pngも可）、通知アイコンは<名>.png。
      schema:
        type: string
  responses:
    MethodNotAllowed:
      description: '未対応のメソッド。`{ "error": "method not allowed" }`。'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: ホスト内部のエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
      description: 操作完了。データはGET /stateから取得します。
    FailureResponse:
      type: object
      required:
        - ok
        - reason
      properties:
        ok:
          type: boolean
          const: false
        reason:
          type: string
          description: 失敗の分類。bad-requestは不正引数、provider-missingは会話モデルなし、generate-errorは生成・IO失敗、pet-requiredは対象省略、unknown-petは対象なし、unknown-imageは画像なし、unknown-animationは動画プール外。lockedは他者の占有中（expiresAt付き）、lock-requiredは占有中のlock省略、lock-lostは有効でないID（cause付き）。
          enum:
            - bad-request
            - provider-missing
            - generate-error
            - pet-required
            - unknown-pet
            - unknown-image
            - unknown-animation
            - locked
            - lock-required
            - lock-lost
        cause:
          type: string
          description: lock-lost時だけ存在する失効理由。expiredは期限切れ、releasedは解放済み、preemptedはユーザーの操作・非表示・終了による解除、unknownは不明なID。
          enum:
            - expired
            - released
            - preempted
            - unknown
        expiresAt:
          type: integer
          format: int64
          description: locked時の占有期限（エポックms）。再試行の判断に使用します。
          example: 1755000030000
        message:
          type: string
          description: 任意の読みやすい補足説明
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    PollState:
      type: object
      required:
        - counter
        - sections
        - pets
      description: 統一状態S。各リーフはcounterとdataを持ちます。トップレベルcounterは全体のバージョンで、リーフではありません。sections.configも変更通知用リーフです。
      properties:
        counter:
          type: integer
          format: int64
          minimum: 0
          description: 最後の書き込み番号。全リーフのcounterの最大値に等しい全体のバージョンです。dataを持たずリーフ比較には含めません。sinceとして送り、変更判定に使用します。0は未書き込み。
          example: 1755000000007
        sections:
          type: object
          description: 全画面で共有する状態
          required:
            - balance
            - workStatus
            - notify
            - config
          properties:
            balance:
              $ref: "#/components/schemas/BalanceLeaf"
            workStatus:
              $ref: "#/components/schemas/WorkStatusLeaf"
            notify:
              $ref: "#/components/schemas/NotifyLeaf"
            config:
              $ref: "#/components/schemas/ConfigLeaf"
        pets:
          type: object
          description: ペットIDごとの状態。IDはドットを含められるため分割禁止。
          additionalProperties:
            type: object
            required:
              - say
              - anim
              - position
              - throw
              - lock
            properties:
              say:
                $ref: "#/components/schemas/SayLeaf"
              anim:
                $ref: "#/components/schemas/AnimLeaf"
              position:
                $ref: "#/components/schemas/PositionLeaf"
              throw:
                $ref: "#/components/schemas/ThrowLeaf"
              lock:
                $ref: "#/components/schemas/LockLeaf"
      examples:
        typical:
          summary: 残高とひとりごとがあるペット
          value:
            counter: 1755000000600
            sections:
              balance:
                counter: 1755000000000
                data:
                  ok: true
                  provider: deepseek
                  kind: deepseek
                  data:
                    currency: CNY
                    total: "42.00"
                    granted: "10.00"
                    toppedUp: "32.00"
              workStatus:
                counter: 1755000000100
                data:
                  state: working
                  task: src/host/index.tsを読んでいます
              notify:
                counter: 1755000000200
                data:
                  type: session/event
                  event:
                    type: turn/end
                    data:
                      reason:
                        kind: completed
              config:
                counter: 1755000000600
                data: {}
            pets:
              main:
                say:
                  counter: 1755000000300
                  data:
                    text: ご主人、今日も頑張ろうね！
                    image: 可爱
                anim:
                  counter: 1755000000400
                  data:
                    name: 东张西望
                    playbackId: pb-mfh2k1-1
                position:
                  counter: 1755000000500
                  data:
                    x: 0.5
                    y: 0.35
                    mode: spring
                throw:
                  counter: 0
                  data: null
    BalanceLeaf:
      type: object
      required:
        - counter
        - data
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: BalanceState。nullは未書き込み。標準1800秒の定期更新またはPOST /balanceが更新します。
          oneOf:
            - $ref: "#/components/schemas/BalanceView"
            - $ref: "#/components/schemas/BalanceUnavailable"
            - type: "null"
    BalanceView:
      type: object
      required:
        - ok
        - provider
        - kind
      description: 残高を利用可能
      properties:
        ok:
          type: boolean
          const: true
        provider:
          type: string
          example: deepseek
        kind:
          type: string
          description: プロバイダーの種類。opencode/commandcodeは使用率、deepseekは口座金額。opencodeは3期間を返します。commandcodeはmonthlyが必須で、rolling/weeklyはプランに期間制限があるときだけ存在します。省略は枠なしであり、利用率0%ではありません。
          enum:
            - opencode
            - deepseek
            - commandcode
        manual:
          type: boolean
          description: POST /balance、/balanceコマンド、デスクトップメニューなどの手動更新時だけ存在します。利用不可の場合にも説明を必ず表示する判断に使用します。
        rolling:
          type: number
          description: opencode/commandcode：5時間枠の利用率（0〜100）
        weekly:
          type: number
          description: opencode/commandcode：週間枠の利用率（0〜100）
        monthly:
          type: number
          description: opencode/commandcode：月間枠の利用率（0〜100）
        rollingResetsAt:
          type: string
          format: date-time
          description: 5時間枠のリセット日時
        weeklyResetsAt:
          type: string
          format: date-time
          description: 週間枠のリセット日時
        monthlyResetsAt:
          type: string
          format: date-time
          description: 月間枠のリセット日時
        rollingCapUsd:
          type: number
          description: commandcode：5時間枠の上限USD。最も厳しい枠の判定に使用。
        weeklyCapUsd:
          type: number
          description: commandcode：週間枠の上限USD
        monthlyCapUsd:
          type: number
          description: commandcode：月間上限USD（当期消費＋残量）。消費も上限もなければ省略。
        currency:
          type: string
          description: deepseek：通貨
        total:
          type: string
          description: deepseek：合計残高。上流APIと同じ文字列型。
        granted:
          type: string
          description: deepseek：付与された残高
        toppedUp:
          type: string
          description: deepseek：入金された残高
    BalanceUnavailable:
      type: object
      required:
        - ok
        - provider
        - reason
      description: 残高が利用できないことを明示する状態
      properties:
        ok:
          type: boolean
          const: false
        provider:
          type: string
        manual:
          type: boolean
          description: BalanceView.manualと同じ
        reason:
          type: string
          enum:
            - unsupported
            - credential-missing
            - fetch-error
          description: unsupportedは未対応、credential-missingは認証情報不足、fetch-errorは取得失敗。
        message:
          type: string
    WorkStatusLeaf:
      type: object
      required:
        - counter
        - data
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: WorkStatusSnapshot。nullは未書き込み。turn/start、tool/call、tool/result、approval/asked、turn/endなどから集計します。
          oneOf:
            - $ref: "#/components/schemas/WorkStatusSnapshot"
            - type: "null"
    WorkStatusSnapshot:
      type: object
      required:
        - state
        - task
      properties:
        state:
          description: animations.events.workStatusの添字に対応する作業段階。nullは待機中。
          oneOf:
            - type: string
              enum:
                - thinking
                - working
                - result
                - waiting
                - success
                - error
            - type: "null"
        task:
          description: todo/writeツールに基づく現在のタスク詳細。nullの場合があります。
          oneOf:
            - type: string
            - type: "null"
    NotifyLeaf:
      type: object
      required:
        - counter
        - data
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: 通知フレーム。nullは未書き込み。ホストイベントから生成し、描画側が変化を検知してOS通知を表示します。1スロットで新しい通知が上書きし、キューにはしません。
          oneOf:
            - $ref: "#/components/schemas/NotifyFrame"
            - type: "null"
    ConfigLeaf:
      type: object
      required:
        - counter
        - data
      description:
        設定変更の純粋な通知。dataは常に空オブジェクトで、counterが変わればGET /configを再取得します。毎回返すstateへ大きい設定全体を含めないための仕組みです。現在の更新元はPOST
        /pet-displayだけです。PUT/POST /configは呼び出し元が統合設定を受け取るため更新しません。ファイルの手動編集はmtime監視せず、再読み込みが必要です。
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          type: object
          description: 常に空オブジェクト。設定本体はGET /configから取得。
          maxProperties: 0
    NotifyFrame:
      oneOf:
        - $ref: "#/components/schemas/TurnEndFrame"
        - $ref: "#/components/schemas/ApprovalFrame"
        - $ref: "#/components/schemas/QuestionFrame"
        - $ref: "#/components/schemas/AgentErrorFrame"
      discriminator:
        propertyName: type
        mapping:
          session/event: "#/components/schemas/TurnEndFrame"
          approval/requested: "#/components/schemas/ApprovalFrame"
          question/requested: "#/components/schemas/QuestionFrame"
          host/agent-error: "#/components/schemas/AgentErrorFrame"
    TurnEndFrame:
      type: object
      required:
        - type
        - event
      description: ターン終了通知。completed/error/max-tokensだけ通知し、abortedなどは対象外。
      properties:
        type:
          type: string
          const: session/event
        event:
          type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              const: turn/end
            data:
              type: object
              properties:
                reason:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - completed
                        - error
                        - max-tokens
                    error:
                      type: object
                      properties:
                        message:
                          type: string
    ApprovalFrame:
      type: object
      required:
        - type
      description: モデルがツールの権限を要求
      properties:
        type:
          type: string
          const: approval/requested
        toolName:
          type: string
          description: 権限を要求するツール名（任意）
        reason:
          type: string
          description: 要求理由（任意）
    QuestionFrame:
      type: object
      required:
        - type
        - questions
      description: ask_user_questionツールがユーザーの回答待ち
      properties:
        type:
          type: string
          const: question/requested
        questions:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              question:
                type: string
    AgentErrorFrame:
      type: object
      required:
        - type
        - message
      description: ターンに結びつかない生成エラー（DSH 0.1.5以降のagent/error）
      properties:
        type:
          type: string
          const: host/agent-error
        message:
          type: string
    AnimLeaf:
      type: object
      required:
        - counter
        - data
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: 再生指令。nullは未書き込み。同じ動画の再要求もcounterが増加します。nameは素材名、urlは外部の完全URLで、POST /animが厳密に一方であることを検証します。
          oneOf:
            - $ref: "#/components/schemas/Anim"
            - type: "null"
    Anim:
      type: object
      description: 再生する動画。nameとurlは一方だけ。facingがなければ現在の向きを維持します。
      properties:
        name:
          type: string
          description: 所属動画プールの名前。素材ルートと名前からURLを作り、文字の反転補正・実移動などのメニュー動作を適用します。
          example: 东张西望
        url:
          type: string
          description: 外部の完全URL。そのまま素材として読み、メニュー属性を適用せず1回再生して通常動作へ戻ります。nameかurlかはフィールド名で区別し、文字列のhttp接頭辞から推測しません。
          example: https://cdn.example.com/sidebar.webm
        facing:
          type: string
          enum:
            - left
            - right
          description: 呼び出し元の明示的な向き。省略は現在の向きを維持し、leftへの既定化はしません。name/urlのどちらでも指定できます。
          example: right
    PositionLeaf:
      type: object
      required:
        - counter
        - data
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: 位置の指令。nullは未書き込み。ホストが書き、描画側は実行するだけで書き戻しません。現在位置の報告ではありません。
          oneOf:
            - $ref: "#/components/schemas/PositionCue"
            - type: "null"
    PositionCue:
      type: object
      required:
        - x
        - y
        - mode
      properties:
        x:
          type: number
          description: 中心の横座標。0〜1、ホストで補正済み。
        y:
          type: number
          description: 中心の縦座標。0〜1、ホストで補正済み。
        mode:
          type: string
          enum:
            - instant
            - spring
            - line
          description: instantは即時、springは過減衰ばね、lineはdurationで直線移動。
        duration:
          type: number
          description: lineだけに存在する所要時間ms。非負有限数で0は即時。
    ThrowLeaf:
      type: object
      required:
        - counter
        - data
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: 投擲の初速度指令。nullは未書き込み。ホストが書き、描画側は実行するだけで書き戻しません。
          oneOf:
            - $ref: "#/components/schemas/ThrowCue"
            - type: "null"
    ThrowCue:
      type: object
      required:
        - angle
        - power
      properties:
        angle:
          type: number
          description: 角度。0は右、90は上、-90は下。反時計回りが正。
        power:
          type: number
          exclusiveMinimum: 0
          description: 力の倍率。1は速度制限前1200px/s、実初速は約1021px/s。
    SayLeaf:
      type: object
      required:
        - counter
        - data
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: 発話指令。nullは未書き込み。Sayは表示、SayClearは清去。ひとりごと・コマンド・会話の返答は同じ表示スロットとevents.whisperの動画を共有します。
          oneOf:
            - $ref: "#/components/schemas/Say"
            - $ref: "#/components/schemas/SayClear"
            - type: "null"
    LockLeaf:
      type: object
      required:
        - counter
        - data
      properties:
        counter:
          $ref: "#/components/schemas/Counter"
        data:
          description: 占有状態。nullは占有なし。lock/lock/releaseが更新し、期限切れはホストが遅延判定して更新します。指令ではなく状態であり、描画側が自動動作・自動動画・残高・作業状態を停止します。明示的なsay/anim/position/throwは遮断しません。期限のexpiresAtを唯一の基準とし、過去なら解除済みと判断して描画側で解除します。lockIdは所有者の資格情報なので全体状態には含めません。
          oneOf:
            - $ref: "#/components/schemas/LockState"
            - type: "null"
    LockState:
      description: lockedフィールドで区別する占有状態
      oneOf:
        - $ref: "#/components/schemas/LockOn"
        - $ref: "#/components/schemas/LockOff"
    LockOn:
      type: object
      required:
        - locked
        - expiresAt
      description: 外部が占有中。ペットの自動動作を停止します。
      properties:
        locked:
          type: boolean
          const: true
        expiresAt:
          type: integer
          format: int64
          description: 占有の有効期限（エポックms）
          example: 1755000030000
    LockOff:
      type: object
      required:
        - locked
      description: 占有なし。通常のランダム動作・移動・ひとりごと・残高・作業状態を再開します。
      properties:
        locked:
          type: boolean
          const: false
    Say:
      type: object
      required:
        - text
      description: 吹き出しを表示
      properties:
        text:
          type: string
          description: 表示本文。空文字列は描画側で無視します。
        image:
          type: string
          description: 任意の画像名。URLではなくmemesのキーで、拡張子なしのファイル名です。素材ルートを使ってpic/memes/<ルート>/<名>.pngを組み立てます。通常の生成では画像設定が有効な場合に出現します。外部URLは別のurlフィールドで、broadcastだけが書きます。
        url:
          type: string
          description: 任意の外部画像URL。そのままsrcに使用し、画像プールのパスは付けません。broadcastだけが書き、imageと同時には存在しません。
        duration:
          type: number
          minimum: 0
          description: 表示時間ms。省略は10000、0は表示しません。broadcastだけが補完済みの値を書き、ひとりごと・会話では省略します。
          example: 10000
        anim:
          type: boolean
          description: events.whisperとの連動。省略はtrue。明示falseでは動画プールを読まずに吹き出しだけ表示します。broadcastだけが書きます。
          example: true
    SayClear:
      type: object
      required:
        - clear
      description: bubble/clearによる清去指令。counterが変化し、この形なら発話の吹き出しを閉じます。動画は変更しません。空のtextは無効扱いなので清去の代わりにはなりません。
      properties:
        clear:
          type: boolean
          const: true
          description: 常に厳密なtrue。それ以外は通常の発話として扱います。
    Counter:
      type: integer
      format: int64
      minimum: 0
      description: リーフのバージョン。Date.now()を基に同一ミリ秒でも加算し、再起動後も逆行しません。前回値と一致なら描画を省略します。0は未書き込み。
    ChatMemoryMessage:
      type: object
      required:
        - role
        - content
        - ts
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
          description: 画像マーカーを含まないメッセージ本文
        ts:
          type: integer
          format: int64
          description: 保存日時のタイムスタンプms
    Provider:
      type: object
      required:
        - id
        - name
        - models
      properties:
        id:
          type: string
        name:
          type: string
          description: 表示名。なければid。
        models:
          type: array
          description: プロバイダーのモデル。取得できなければ空配列。
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
    StorageEntry:
      type: object
      description: 1か所の保存先
      properties:
        label:
          type: string
        path:
          type: string
      additionalProperties: true
    ModelSelection:
      type: object
      description: エントリーごとのモデル指定。provider/modelは両方空か両方指定が必須。両方空なら現在の会話のモデル、片方だけは無効です。
      required:
        - provider
        - model
      properties:
        provider:
          type: string
        model:
          type: string
    Position:
      type: object
      required:
        - corner
        - marginX
        - marginY
      properties:
        corner:
          type: string
          description: 配置する隅
          enum:
            - top-left
            - top-right
            - bottom-left
            - bottom-right
        marginX:
          type: number
          description: 横方向の余白px
        marginY:
          type: number
          description: 縦方向の余白px
    PetEntry:
      type: object
      description: PUT /configが受け付ける許可項目のペット設定
      required:
        - id
        - name
        - size
        - balanceEnabled
        - display
        - position
      properties:
        id:
          type: string
          maxLength: 64
          description: ペットID。Windows予約文字と制御文字などのファイル名に使えない文字は禁止。
        name:
          type: string
          description: 表示名。空ならidを使用し、警告します。
        size:
          type: number
          exclusiveMinimum: 0
          description: ペットの横幅px
        balanceEnabled:
          type: boolean
        whisperEnabled:
          type: boolean
          description: 定期的なひとりごとの有効化。POST /whisperは制限しません。
        workStatusEnabled:
          type: boolean
        fixedEnabled:
          type: boolean
          description: trueで自動の方向転換と移動を止め、待機としぐさだけにします。ランダムチェーンだけに適用し、メニュー・anim API・イベント・クリック・ドラッグには影響しません。標準false。
        display:
          type: string
          enum:
            - web
            - desktop
            - both
            - none
          description: ブラウザーのみ・デスクトップのみ・両方・非表示
        position:
          $ref: "#/components/schemas/Position"
    SaveConfigRequest:
      type: object
      required:
        - pets
      properties:
        pets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PetEntry"
        notificationsEnabled:
          type: boolean
        whisperImageEnabled:
          type: boolean
        chatImageEnabled:
          type: boolean
        confineToScreen:
          type: boolean
        chatMemoryRounds:
          type: integer
          minimum: 0
          description: 全体の既定の会話履歴往復数。1往復は質問と回答、0は履歴なし、標準5。保存済み履歴を削除せず、リクエストの文脈に含める範囲だけを制御します。
        chatImageLimit:
          type: integer
          minimum: 0
          description: モデルへ渡す会話画像の候補上限。設定順の先頭N枚、0で全件、標準10。毎メッセージに候補を添えるため、上限でトークン消費を調整できます。
    PetConfigEntry:
      type: object
      description: 統合後の種族設定。PetEntryに加えてwhisperPrompt、chatMemoryRounds、モデル、memes、workStatusTexts、physics、animations、eventsRefreshSec、animationWeightsなどを含みます。全項目と標準値はコメント付きassets/config.jsoncを参照してください。
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: number
        balanceEnabled:
          type: boolean
        whisperEnabled:
          type: boolean
        workStatusEnabled:
          type: boolean
        fixedEnabled:
          type: boolean
          description: 自動の方向転換・移動を停止。手動操作には影響しません。
        display:
          type: string
          enum:
            - web
            - desktop
            - both
            - none
        position:
          $ref: "#/components/schemas/Position"
        whisperPrompt:
          type: string
          description: ひとりごと・会話に共通の人格プロンプト
        chatMemoryRounds:
          type: integer
          description: 会話履歴の往復数（質問と回答で1往復）
        whisperModel:
          $ref: "#/components/schemas/ModelSelection"
        chatModel:
          $ref: "#/components/schemas/ModelSelection"
        whisperImageEnabled:
          type: boolean
        chatImageEnabled:
          type: boolean
        chatImageLimit:
          type: integer
          minimum: 0
          description: 会話画像候補の上限。0で無制限。ランダムに1枚選ぶひとりごとには影響しません。
        memes:
          type: object
          description: 画像プール。キーは画像名、値はモデルが選ぶための内容説明。
          additionalProperties:
            type: string
        workStatusTexts:
          type: array
          description: 作業状態の吹き出し候補。添字はanimations.events.workStatusと一致させます。
          items:
            type: string
        eventsRefreshSec:
          type: object
          description: ホストのタイマーが実行する定期更新間隔の秒数。クライアントから周期処理をポーリングする必要はありません。
          properties:
            balance:
              type: integer
              default: 1800
              description: 残高の更新間隔
            whisper:
              type: integer
              default: 300
              description: ひとりごとの生成間隔
      additionalProperties: true
